<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6f7a7c" />
    <title>Dublin Drive</title>
    <meta name="description" content="Drive (or fly) around Dublin in your browser: the quays, O'Connell Street, Grafton Street, Temple Bar, Croke Park and the Phoenix Park. Free, no install." />
    <!-- link previews (WhatsApp, Reddit, X, iMessage). og:url / og:image must be absolute: update SITE_URL when the custom domain is live -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dublin Drive" />
    <meta property="og:title" content="Dublin Drive: drive around Dublin in your browser" />
    <meta property="og:description" content="The quays, O'Connell Street, Grafton Street, Temple Bar, Croke Park, the Phoenix Park and more. Garda pursuits, time trials, a helicopter. Free, no install." />
    <meta property="og:url" content="https://seadnad.github.io/dublin-city/" />
    <meta property="og:image" content="https://seadnad.github.io/dublin-city/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dublin from the air in the game: the Liffey, O'Connell Bridge and the Spire" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23169b62'/%3E%3Cpath d='M32 6 L35 58 L29 58 Z' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="loading">
      <div class="loading-art" aria-hidden="true">
        <div class="loading-sun"></div>
        <div class="loading-city"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="loading-river"></div>
        <div class="loading-road"><i></i><i></i><i></i></div>
      </div>
      <div class="loading-copy">
        <span class="loading-kicker">A city in your browser</span>
        <h1>Dublin <span>Drive</span></h1>
        <p class="loading-intro">Your streets are taking shape. Your drive starts as soon as the city is ready.</p>
        <p class="loading-step" role="status" aria-live="polite">Getting the city ready&hellip;</p>
        <p class="loading-wait">The first visit may take 30 seconds or longer, especially on older devices. Keep this tab open.</p>
      </div>
    </div>
    <div id="hud"></div>
    <script type="module" src="./src/boot.js"></script>
  </body>
</html>
